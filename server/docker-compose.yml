# PhantomMirror 全栈（Phase 1）：存储层 + API
#
# 部署目标：自有云服务器（101.35.163.174）
# 该服务器上已有原生 PostgreSQL 14 / Redis 6 在跑，且 5432 / 6379 端口被占用，
# 因此本栈刻意使用备用端口（5433 / 6380 / 9000）并绑定 127.0.0.1，
# 与服务器上已有服务完全隔离，可随时 `docker compose down` 干净拆除。
#
# 默认只绑本机：本地开发时通过 SSH 隧道访问（见 README / 架构文档）。
# 若将来需要对外提供服务，改 .env 里的 *_BIND 并在云厂商安全组放行对应端口。
#
# ── 两种用法 ────────────────────────────────────────────────────
#   服务器部署：`docker compose up -d --build`（含 app 服务）
#   本地开发  ：不起 app（开发机没装 docker），本机 `npm run start` 走 SSH 隧道
#              连上面几个容器；容器端口都只绑 127.0.0.1，隧道即全部通路。
#
# app 服务 environment 段覆盖的那几项，是因为**容器之间走 compose 网络**：
# 用服务名当主机名、容器内端口（5432/6379/9000），而不是宿主映射出去的那些。
# 不覆盖的话，.env 里给本机隧道用的 127.0.0.1:5433 在容器里根本连不通。
# ────────────────────────────────────────────────────────────────

name: phantommirror

services:
  postgres:
    image: postgres:16-alpine
    container_name: pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantommirror}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先复制 .env.example 为 .env}
      POSTGRES_DB: ${POSTGRES_DB:-phantommirror}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phantommirror} -d ${POSTGRES_DB:-phantommirror}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pm-redis
    restart: unless-stopped
    # appendonly 打开：BullMQ 的任务状态不能因为重启就丢
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先复制 .env.example 为 .env}
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    volumes:
      - pm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pm-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # MinIO 要求 root 密码至少 8 位，且不能等于用户名
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请先复制 .env.example 为 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请先复制 .env.example 为 .env}
    ports:
      # 9000 是 S3 API（客户端直传 / 预签名 URL 走这里）
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      # 9001 是 Web 控制台，始终只绑本机，靠 SSH 隧道访问
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - pm-minio-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内构建时在 .env 里设 NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: pm-app
    restart: unless-stopped
    env_file: .env
    environment:
      # ↓ 覆盖 .env 里给本机隧道用的连接串，改成 compose 网络内的地址
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      # 注意：S3_PUBLIC_ENDPOINT 故意**不覆盖** —— 它必须保持 .env 里
      # 那个「手机能访问到的地址」（公网 IP:9000），签名要绑在它上面。
    ports:
      # 手机要直连 API，这里不能只绑 127.0.0.1
      - "${APP_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pm-postgres-data:
  pm-redis-data:
  pm-minio-data: